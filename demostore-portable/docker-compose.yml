version: '3.8'

# Pin images by digest (captured from your running server) so pulls stay identical.
# To refresh digests after a deliberate image upgrade: docker image inspect <name> --format '{{index .RepoDigests 0}}'

services:
  db:
    image: mysql@sha256:f37951fc3753a6a22d6c7bf6978c5e5fefcf6f31814d98c582524f98eae52b21
    restart: always
    container_name: demostore_mysql
    ports:
      - "${MYSQL_PUBLISH_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-demostore}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: supersqa/demostore-wordpress@sha256:2719ddaab6bc5ef0f0a621a66334401a14a5208a12b5f613058cf2ce88a7f295
    container_name: demostore_wp
    ports:
      - "${WP_PUBLISH_PORT:-7171}:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: demostore_mysql:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-password}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-demostore}
      WORDPRESS_IP: ${WORDPRESS_IP:-0.0.0.0}
    volumes:
      - wordpress_html:/var/www/html

volumes:
  mysql_data:
  wordpress_html:
