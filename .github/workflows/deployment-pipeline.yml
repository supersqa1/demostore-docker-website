#           echo "🎉 Health check completed successfully!"

  build-image:
    runs-on: ubuntu-latest
    # needs: healthcheck
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "🔐 Logging into Docker Hub..."
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          if [ $? -eq 0 ]; then
            echo "✅ Successfully logged into Docker Hub!"
          else
            echo "❌ Failed to login to Docker Hub"
            exit 1
          fi
      
      - name: Build and push Docker image
        run: |
          set -x
          echo "🔨 Verifying environment and that docker is installed."
          ls -la
          docker --version
          docker images
          echo "🔨 Building Docker image..."
          cd demostore-basic
          
          # Get commit hash for tagging (8 characters for uniqueness)
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          echo "📝 Building image with commit hash: $COMMIT_HASH"
          
          # Build with both latest and commit hash tags
          docker build -t supersqa/demostore-wordpress:latest -t supersqa/demostore-wordpress:$COMMIT_HASH .
          docker images
          echo "🎉 Image build completed successfully!"
          
          echo "🔨 Pushing images to Docker Hub..."
          docker push supersqa/demostore-wordpress:latest
          docker push supersqa/demostore-wordpress:$COMMIT_HASH
          echo "🎉 Images pushed to Docker Hub successfully!"
          echo "📋 Pushed tags: latest, $COMMIT_HASH"

        #   echo "📦 Pulling base images"
        #   echo "🏗️  Building application layers"
        #   echo "📋 Running security scans"
        #   echo "🎉 Image build completed successfully!"
        #   echo "📊 Image size: 1.2GB"
        #   echo "🏷️  Tag: demostore:latest"

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-image
    if: always()
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Development
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DOCKER_IMAGE: supersqa/demostore-wordpress
        run: |
          set -x
          echo "🚀 Deploying to Development environment..."
          echo "🌍 Environment: development"
          echo "🔧 Target host: $DEV_HOST"
          
          # Create SSH directory and key file
          mkdir -p ~/.ssh
          echo "$DEV_SSH_KEY" > ~/.ssh/dev_key
          chmod 600 ~/.ssh/dev_key
          ls -la ~/.ssh/
          
          # Get the latest commit hash for the image tag
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          echo "📝 Deploying image: $DOCKER_IMAGE:$COMMIT_HASH"
          
          # SSH into dev machine and deploy
          ssh -i ~/.ssh/dev_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $DEV_USER@$DEV_HOST << EOF
            echo "🔧 Starting deployment on dev machine..."
            
            # Pull the latest image
            echo "🔨 Pulling image from Docker Hub..."
            docker pull supersqa/demostore-wordpress:$COMMIT_HASH
            echo "🎉 Image pulled from Docker Hub successfully!"
            docker images
            
            # # Stop existing container
            # docker stop demostore-dev || true
            # docker rm demostore-dev || true
            
            # # Run new container
            # docker run -d \
            #   --name demostore-dev \
            #   --restart unless-stopped \
            #   -p 8080:80 \
            #   -e WORDPRESS_DB_HOST=localhost \
            #   -e WORDPRESS_DB_NAME=demostore_dev \
            #   -e WORDPRESS_DB_USER=wordpress \
            #   -e WORDPRESS_DB_PASSWORD=dev_password \
            #   supersqa/demostore-wordpress:$COMMIT_HASH
            
            echo "✅ Container started successfully"
            
            # Wait for container to be ready
            sleep 10
            
            # Check if container is running
            # if docker ps | grep -q demostore-dev; then
            #   echo "🎉 Deployment completed successfully!"
            #   echo "🌐 Application available at: http://$DEV_HOST:8080"
            # else
            #   echo "❌ Deployment failed - container not running"
            #   exit 1
            # fi
          EOF
          
          # Check if SSH command was successful
          if [ $? -ne 0 ]; then
            echo "❌ SSH deployment failed"
            exit 1
          fi
          
          # Clean up SSH key
          rm -f ~/.ssh/dev_key
          
          echo "🎉 Deployment to Dev completed successfully!"

