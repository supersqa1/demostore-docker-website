name: Deployment Pipeline

on:
  push:
    branches: [ main, ci/deployment-pipeline ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
#   healthcheck:
#     runs-on: ubuntu-latest
#     steps:
